function b2a(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)})}
function show(t){document.getElementById("m").textContent=t}
async function keyFrom(pw){
 var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),{name:"PBKDF2"},false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt:b2a(S),iterations:IT,hash:"SHA-256"},
   km,{name:"AES-GCM",length:256},true,["decrypt"]);
}
async function openWith(key){
 var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b2a(IV)},key,b2a(D));
 var html=new TextDecoder().decode(pt);
 // full re-parse so inline scripts actually run
 document.open(); document.write(html); document.close();
}
async function tryPw(pw,remember){
 show("unlocking\u2026");
 try{
  var key=await keyFrom(pw);
  await openWith(key);
  /* localStorage, NOT sessionStorage. iOS Safari wipes sessionStorage whenever
     it reclaims memory from a backgrounded tab, which on a phone is constantly
     — he was re-entering the password every single time he reopened the tab.
     localStorage survives that, and survives a reboot.
     The tradeoff, stated: the password now persists on the device. That is
     acceptable here because the device is his and already passcode-locked, the
     pages are read-only dashboards, and the two that can move money (/caps,
     /withdraw) require a MetaMask signature this password cannot provide.
     Both stores are written so an older cached page that still reads
     sessionStorage keeps working. */
  if(remember){
   try{localStorage.setItem("sk",pw)}catch(e){}
   try{sessionStorage.setItem("sk",pw)}catch(e){}
  }
 }catch(e){
   /* A STORED PASSWORD THAT NO LONGER WORKS MUST CLEAR ITSELF. Now that the
      value persists across sessions, a rotated gate password would otherwise
      auto-submit a stale one forever and he could never reach the prompt. */
   try{localStorage.removeItem("sk")}catch(_){}
   try{sessionStorage.removeItem("sk")}catch(_){}
   show("wrong password"); document.getElementById("p").value="";
  }
}
document.getElementById("go").onclick=function(){tryPw(document.getElementById("p").value,true)};
document.getElementById("p").addEventListener("keydown",function(e){if(e.key==="Enter")tryPw(e.target.value,true)});
// already unlocked this session? go straight in
(function(){var pw=null;
 try{pw=localStorage.getItem("sk")}catch(e){}
 if(!pw) try{pw=sessionStorage.getItem("sk")}catch(e){}   // pre-2026-11-26 pages
 if(pw) tryPw(pw,false);})();
})();
