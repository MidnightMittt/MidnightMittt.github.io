<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><title>Whitelist stocks</title>
<style>
:root{--bg:#07040f;--pan:rgba(22,10,38,.72);--line:rgba(190,120,255,.30);--ink:#f3e9ff;
--mut:#7d6aa3;--grn:#4dff9e;--red:#ff5d8f;--acc:#4de3ff;--amb:#ffc24d;
--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);
font:13.5px/1.55 var(--mono);padding:1.2rem 1rem 3rem}
.wrap{max-width:40rem;margin:0 auto}
h1{font-size:1rem;letter-spacing:.1em;margin:0 0 .2rem}
.sub{color:var(--mut);font-size:.72rem;margin-bottom:1rem}
.card{background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-bottom:.9rem}
.sym{font-size:1.1rem;font-weight:700;letter-spacing:.05em}
.row{display:flex;justify-content:space-between;font-size:.74rem;color:var(--mut);margin-top:.25rem}
.row b{color:var(--ink);font-weight:400}
.ok{color:var(--grn)}.no{color:var(--red)}.amb{color:var(--amb)}
.steps{margin:.6rem 0 .2rem;font-size:.74rem}
.step{display:flex;gap:.5rem;align-items:center;padding:.15rem 0}
.dot{width:1.1rem;text-align:center}
button{width:100%;margin-top:.6rem;padding:.65rem;border-radius:10px;cursor:pointer;
border:1px solid var(--acc);background:rgba(77,227,255,.12);color:var(--acc);
font:700 .78rem/1 var(--mono);letter-spacing:.08em}
button[disabled]{opacity:.35;cursor:default}
.msg{font-size:.72rem;margin-top:.5rem;word-break:break-all;color:var(--mut)}
.pre{font-size:.68rem;color:var(--mut);border-top:1px dashed var(--line);margin-top:.5rem;padding-top:.4rem}
</style></head><body><div class="wrap">
<h1>WHITELIST TOKENIZED STOCKS</h1>
<div class="sub">verified against the issuer bytecode, not the ticker</div>
<div id="pre" class="sub"></div>
<div id="cards"></div>
<div class="sub" style="margin-top:1rem">Safari cannot sign. Open in the <b>MetaMask app browser</b>.<br>
One tap = ONE transaction. If a prompt is missed, tap again — it resumes where it stopped.</div>
</div>
<script>
(function(){
var MOD="0xa20660ABf6e07D6607d7C3aaDAee6E745EDBBE5E";
var RPC="https://rpc.mainnet.chain.robinhood.com";
var CHAIN="0x1237", CHAINDEC=4663;
var USDGADDR="0x5fc5360d0400a0fd4f2af552add042d716f1d168";
var PMADDR="0x8366a39cc670b4001a1121b8f6a443a643e40951";
var SPYREF="0x117cc2133c37b721f49de2a7a74833232b3b4c0c";
/* ANT — the GENUINE tokenized Anthropic, verified by issuer bytecode on
   2026-11-19 among NINETEEN lookalikes (two of them named "Anthropic IPO" and
   "ANTHROPIC • Robinhood Token"). As of listing it had NO USDG pool: the only
   pools pairing it were against memecoins (ANTH, CYBERDYNE, DOOMER, FROGE,
   QUEEN) through a dynamic-fee hook. So this card DISCOVERS the pool itself by
   deriving candidate poolIds through the module's own poolId() and checking
   each for real liquidity. It stays disabled until one exists. A whitelist
   pointing at a junk pool is worse than no whitelist. */
var ANTGRID=[[500,10],[2500,25],[3000,60],[1000,10],[8000,80],[9000,90],[10000,200],[2400,24],[1500,15],[100,1]];
var LIST=[
 {sym:"NVDA",tok:"0xd0601ce157db5bdc3162bbac2a2c8af5320d9eec",
  pool:"0x3bb34a44f1b2b5f32c034c38a53065a521a47b199700fa9bd19d60985ff24bf1",
  fee:"0.30%",per:2n,day:5n,note:"~$152/share · $195k/day"},
 /* POOL CONFIRMED 2026-11-19 17:16Z. Discovery found it, and it is now
    hardcoded: a known id cannot fail to be found. It opened at the MSTR tier
    (0.25%/sp25), one of the seven candidate ids computed before it existed.
    Caps sized in DOLLARS at the live ~$95/share, not in tokens. */
 {sym:"ANT",tok:"0xbbb6c29bcc3a1028a2b54310df73f4f7a3bcb373",
  pool:"0x2f7a8107d478db53f870fbd973b95cf7ad6baeb7ed5d9bf3a04927e1700d7988",
  fee:"0.25%",per:3n,day:8n,note:"Anthropic, PBC Class A — issuer verified · ~$95/share"},
 {sym:"MSTR",tok:"0xec262a75e413fafd0df80480274532c79d42da09",
  pool:"0x319bac87e616a89e241c10aeb8afd4892a852cdd8b373cd9765ecddc40b87cfe",
  fee:"0.25%",per:3n,day:9n,note:"~$93/share · $501k/day"}
];
function pad32(h){h=(h||"").replace(/^0x/,"");return "0".repeat(64-h.length)+h}
function rpc(m,p){return fetch(RPC,{method:"POST",headers:{"content-type":"application/json"},
 body:JSON.stringify({jsonrpc:"2.0",id:1,method:m,params:p})}).then(function(r){return r.json()})}
function isOne(hex){return hex && /1$/.test(hex.replace(/0+$/,"")||"0") && BigInt(hex)>0n}

/* PREFLIGHT. The failure he hit was "User denied transaction signature" --
   a wallet-side reject, not a chain problem. Nothing below can fix a missed
   prompt, but showing network and gas BEFORE prompting removes the two causes
   that look identical to a denial. */
var pre=document.getElementById("pre");
Promise.all([rpc("eth_chainId",[]),rpc("eth_gasPrice",[])]).then(function(r){
 var cid=parseInt(r[0].result,16);
 pre.innerHTML='chain '+cid+(cid===CHAINDEC?' <span class="ok">✓</span>':' <span class="no">wrong network</span>')
  +' · gas '+(parseInt(r[1].result,16)/1e9).toFixed(3)+' gwei · ~$0.01 per transaction';
}).catch(function(){pre.textContent="could not reach the chain";});

var out=document.getElementById("cards");
LIST.forEach(function(t,i){
 var per=(t.per*(10n**18n)).toString(16), day=(t.day*(10n**18n)).toString(16);
 /* Each step is INDEPENDENT and IDEMPOTENT: its done-state is read from chain,
    so a missed prompt costs that one step, never the sequence. The old page
    fired all three automatically; on mobile a single dismissed sheet killed
    the whole run and restarting re-sent work already done. */
 t.steps=[
  {k:"token", label:"allow the token", data:"0x3816a292"+pad32(t.tok)+pad32("1"),
   read:function(){return rpc("eth_call",[{to:MOD,data:"0x756742f8"+pad32(t.tok)},"latest"]).then(function(r){return isOne(r.result)})}},
  {k:"pool",  label:"allow the pool",  data:"0x3ce17e8d"+pad32(t.pool)+pad32("1"),
   read:function(){return rpc("eth_call",[{to:MOD,data:"0xc6fedc9b"+pad32(t.pool)},"latest"]).then(function(r){return isOne(r.result)})}},
  {k:"caps",  label:"set caps (both directions)", data:"0xefeec38c"+pad32(t.tok)+pad32(per)+pad32(day),
   read:function(){return rpc("eth_call",[{to:MOD,data:"0x795accdf"+pad32(t.tok)},"latest"]).then(function(r){return r.result&&BigInt(r.result)>0n})}}
 ];
 var d=document.createElement("div");d.className="card";
 d.innerHTML='<div class="sym">'+t.sym+'</div>'
  +'<div class="row"><span>'+t.note+'</span><span>'+t.fee+' pool</span></div>'
  +'<div class="row"><span>caps</span><b>'+t.per+' / '+t.day+' tokens (~$250 / ~$750)</b></div>'
  +'<div class="pre" id="v'+i+'">verifying issuer bytecode…</div>'
  +'<div class="steps" id="s'+i+'"></div>'
  +'<button id="b'+i+'" disabled>CHECKING…</button>'
  +'<div class="msg" id="m'+i+'"></div>';
 out.appendChild(d);
 var b=document.getElementById("b"+i),m=document.getElementById("m"+i),
     v=document.getElementById("v"+i),sEl=document.getElementById("s"+i);

 function paint(){
  sEl.innerHTML=t.steps.map(function(s){
   return '<div class="step"><span class="dot '+(s.done?"ok":"")+'">'+(s.done?"✓":"○")+'</span>'
    +'<span style="color:'+(s.done?"var(--mut)":"var(--ink)")+'">'+s.label+'</span></div>';
  }).join("");
  var next=t.steps.find(function(s){return !s.done});
  if(!t.verified){ b.disabled=true; b.textContent="BLOCKED — NOT THE ISSUER"; return; }
  /* No pool, no arming. Whitelisting a token whose only venues are memecoin
     pairs would hand the module permission it cannot safely use. */
  if(t.noPool||!t.pool){ b.disabled=true; b.textContent="WAITING FOR A USDG POOL"; return; }
  if(!next){ b.disabled=true; b.textContent=t.sym+" FULLY ARMED"; return; }
  b.disabled=false; b.textContent="SIGN: "+next.label.toUpperCase();
 }
 function refresh(){
  return Promise.all(t.steps.map(function(s){return s.read().then(function(x){s.done=x}).catch(function(){s.done=false})}))
   .then(paint);
 }
 /* POOL DISCOVERY — and it must PROVE the pool is real.
    Deriving a poolId always succeeds: it is a pure hash, and an id exists for
    every fee/spacing combination whether or not anyone ever created the pool.
    So an id alone is worthless as evidence. This reads the PoolManager's own
    storage: slot0 at keccak(poolId,6) must carry a non-zero sqrtPrice (the
    pool was initialised) AND liquidity at +3 must be non-zero (there is
    something to trade against). web3_sha3 does the hashing, so no library is
    needed in the browser. */
 function slotOf(id,off){
  return rpc("web3_sha3",[id+pad32("6")]).then(function(r){
   var base=BigInt(r.result)+BigInt(off);
   return "0x"+base.toString(16).padStart(64,"0");
  });
 }
 function discover(){
  if(!t.discover) return Promise.resolve(true);
  var found=null;
  return ANTGRID.reduce(function(chain,fs){
   return chain.then(function(){
    if(found) return;
    var fee=fs[0], sp=fs[1];
    var d="0x3de159e1"+pad32(USDGADDR)+pad32(t.tok)+pad32(fee.toString(16))+pad32(sp.toString(16))+pad32("0");
    return rpc("eth_call",[{to:MOD,data:d},"latest"]).then(function(r){
     if(!r.result||r.result.length<66) return;
     var id=r.result.slice(0,66);
     return slotOf(id,0).then(function(s0){
      return rpc("eth_getStorageAt",[PMADDR,s0,"latest"]).then(function(a){
       var raw=BigInt(a.result||"0x0");
       var sq=raw & ((1n<<160n)-1n);
       if(sq===0n) return;                      // never initialised
       return slotOf(id,3).then(function(s3){
        return rpc("eth_getStorageAt",[PMADDR,s3,"latest"]).then(function(b){
         var liq=BigInt(b.result||"0x0") & ((1n<<128n)-1n);
         if(liq===0n) return;                   // initialised but empty — untradeable
         found={id:id,fee:fee,sp:sp,liq:liq};
        });
       });
      });
     });
    }).catch(function(){});
   });
  },Promise.resolve()).then(function(){
   if(!found) return false;
   t.pool=found.id; t.fee=(found.fee/1e4).toFixed(2)+"%";
   return true;
  });
 }
 // verify issuer, then read step state
 Promise.all([rpc("eth_getCode",[t.tok,"latest"]),rpc("eth_getCode",[SPYREF,"latest"])])
 .then(function(r){
  var mine=r[0].result||"",ref=r[1].result||"";
  t.verified = mine.length>2 && mine===ref;
  v.innerHTML = t.verified
   ? '<span class="ok">✓ issuer verified</span> — bytecode identical to SPY’s contract'
   : '<span class="no">✗ NOT the issuer</span> — refusing to arm this contract';
  if(!t.verified) return paint();
  return discover().then(function(ok){
   if(t.discover && !ok){
    t.noPool=true;
    v.innerHTML+='<br><span class="amb">no USDG pool with liquidity yet</span> — '
      +'the only pools pairing this token are against memecoins through a dynamic-fee hook. Nothing to arm.';
    return paint();
   }
   if(t.discover) v.innerHTML+='<br><span class="ok">USDG pool found</span> — '+t.fee+' tier';
   return refresh();
  });
 }).catch(function(){ v.innerHTML='<span class="no">verification failed — not arming</span>'; });

 b.onclick=async function(){
  if(!window.ethereum){m.innerHTML='<span class="no">open in the MetaMask browser</span>';return}
  var next=t.steps.find(function(s){return !s.done}); if(!next) return;
  b.disabled=true;
  try{
   var a=(await window.ethereum.request({method:"eth_requestAccounts"}))[0];
   await window.ethereum.request({method:"wallet_switchEthereumChain",params:[{chainId:CHAIN}]}).catch(function(){});
   m.innerHTML="simulating "+next.label+"…";
   var sim=await rpc("eth_call",[{from:a,to:MOD,data:next.data},"latest"]);
   if(sim.error) throw new Error(sim.error.message);
   m.innerHTML='<span class="amb">confirm in MetaMask</span> — '+next.label;
   var h=await window.ethereum.request({method:"eth_sendTransaction",params:[{from:a,to:MOD,data:next.data}]});
   m.innerHTML='<span class="ok">sent</span> '+h+' — confirming…';
   for(var k=0;k<30;k++){
    await new Promise(function(r){setTimeout(r,2000)});
    var rc=await rpc("eth_getTransactionReceipt",[h]);
    if(rc.result){ m.innerHTML = rc.result.status==="0x1"
      ? '<span class="ok">✓ '+next.label+' confirmed</span>'
      : '<span class="no">reverted on chain</span>'; break; }
   }
   await refresh();
  }catch(e){
   var msg=(e&&e.message)||String(e);
   m.innerHTML='<span class="no">'+msg+'</span>'
    +(/denied|rejected|User denied/i.test(msg)
      ? '<div style="color:var(--mut);margin-top:.3rem">The prompt was dismissed — nothing was sent and nothing was lost. Tap again; it resumes at this same step.</div>'
      : '');
   await refresh();
  }
 };
});
})();
</script></body></html>
