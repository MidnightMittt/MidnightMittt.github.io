function b2a(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)})}
function show(t){document.getElementById("m").textContent=t}
async function keyFrom(pw){
 var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),{name:"PBKDF2"},false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt:b2a(S),iterations:IT,hash:"SHA-256"},
   km,{name:"AES-GCM",length:256},true,["decrypt"]);
}
async function openWith(key){
 var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b2a(IV)},key,b2a(D));
 var html=new TextDecoder().decode(pt);
 // full re-parse so inline scripts actually run
 document.open(); document.write(html); document.close();
}
async function tryPw(pw,remember){
 show("unlocking\u2026");
 try{
  var key=await keyFrom(pw);
  await openWith(key);
  if(remember) try{sessionStorage.setItem("sk",pw)}catch(e){}
 }catch(e){ show("wrong password"); document.getElementById("p").value=""; }
}
document.getElementById("go").onclick=function(){tryPw(document.getElementById("p").value,true)};
document.getElementById("p").addEventListener("keydown",function(e){if(e.key==="Enter")tryPw(e.target.value,true)});

 if(pw) tryPw(pw,false);})();
